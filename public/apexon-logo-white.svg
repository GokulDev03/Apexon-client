<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d4a8"/>
      <stop offset="45%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#a97c47"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: geometric apex / summit -->
  <g transform="translate(28, 42)">
    <!-- Outer mountain silhouette -->
    <path d="M4 96 L42 24 L58 46 L78 8 L108 96 Z"
          fill="#f5ead9" opacity="0.9"/>
    <!-- Gold ascent line cutting through -->
    <path d="M14 96 L44 40 L59 60 L79 22 L98 96"
          fill="none" stroke="url(#goldGradW)" stroke-width="5.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Summit marker -->
    <circle cx="79" cy="22" r="6.5" fill="#0d3320" stroke="url(#goldGradW)" stroke-width="3"/>
  </g>

  <!-- Wordmark -->
  <text x="168" y="128" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="66" font-weight="800" fill="#f5ead9" letter-spacing="-1">
    Apex<tspan fill="url(#goldGradW)">on</tspan>
  </text>

  <!-- Accent underline -->
  <rect x="171" y="140" width="270" height="3" rx="1.5" fill="url(#goldGradW)"/>

  <!-- Tagline -->
  <text x="171" y="165" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="600" letter-spacing="5" fill="#f5ead9" opacity="0.65">
    SOFTWARE  ·  DEVELOPMENT
  </text>
</svg>
