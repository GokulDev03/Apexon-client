<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d4a8"/>
      <stop offset="45%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#a97c47"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a5c38"/>
      <stop offset="100%" stop-color="#0a2818"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d3320" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Icon mark: geometric apex / summit -->
  <g transform="translate(28, 42)" filter="url(#softShadow)">
    <!-- Outer mountain silhouette -->
    <path d="M4 96 L42 24 L58 46 L78 8 L108 96 Z"
          fill="url(#greenGrad)"/>
    <!-- Gold ascent line cutting through -->
    <path d="M14 96 L44 40 L59 60 L79 22 L98 96"
          fill="none" stroke="url(#goldGrad)" stroke-width="5.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Summit marker -->
    <circle cx="79" cy="22" r="6.5" fill="#f5ead9" stroke="url(#goldGrad)" stroke-width="3"/>
  </g>

  <!-- Wordmark -->
  <text x="168" y="128" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="66" font-weight="800" fill="#0d3320" letter-spacing="-1">
    Apex<tspan fill="url(#goldGrad)">on</tspan>
  </text>

  <!-- Accent underline -->
  <rect x="171" y="140" width="270" height="3" rx="1.5" fill="url(#goldGrad)"/>

  <!-- Tagline -->
  <text x="171" y="165" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="600" letter-spacing="5" fill="#0d3320" opacity="0.55">
    SOFTWARE  ·  DEVELOPMENT
  </text>
</svg>
