<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3320"/>
      <stop offset="100%" stop-color="#0a2818"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d4a8"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>

  <g transform="translate(950,60)" opacity="0.12">
    <path d="M0 90 L45 15 L67 48 L90 8 L128 90 Z" fill="#d4a574"/>
  </g>

  <!-- Content centered with generous side margins (140px) to survive object-cover cropping -->
  <text x="140" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#d4a574">
    HOSPITALS &amp; HEALTHCARE
  </text>

  <text x="140" y="235" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#f5ead9">
    ClearPath Clinic
  </text>
  <text x="140" y="275" font-family="Arial, sans-serif" font-size="19" fill="#f5ead9" opacity="0.75">
    Phone booking overload, solved with a smarter intake flow
  </text>

  <!-- Stat card -->
  <g transform="translate(140, 330)">
    <rect width="420" height="220" rx="20" fill="#f5ead9" opacity="0.97"/>
    <text x="30" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#0d3320" opacity="0.6">
      PHONE BOOKINGS REDUCED
    </text>
    <text x="30" y="130" font-family="Georgia, serif" font-size="80" font-weight="800" fill="#0d3320">
      -40%
    </text>
    <text x="30" y="165" font-family="Arial, sans-serif" font-size="15" fill="#0d3320" opacity="0.6">
      in the first month after launch
    </text>
    <line x1="30" y1="185" x2="390" y2="185" stroke="#0d3320" stroke-opacity="0.1" stroke-width="1"/>
    <text x="30" y="208" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#d4a574">
      10-week project · Custom Software Development
    </text>
  </g>

  <!-- Mini chart card -->
  <g transform="translate(600, 330)">
    <rect width="460" height="220" rx="20" fill="#ffffff" opacity="0.06"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#d4a574" opacity="0.9">
      ONLINE BOOKING ADOPTION
    </text>

    <g font-family="Arial, sans-serif" font-size="11" fill="#f5ead9" opacity="0.8">
      <rect x="30" y="150" width="50" height="40" rx="4" fill="#d4a574" opacity="0.35"/>
      <text x="36" y="170">Wk 1</text>
      <rect x="100" y="120" width="50" height="70" rx="4" fill="#d4a574" opacity="0.55"/>
      <text x="106" y="140">Wk 4</text>
      <rect x="170" y="90" width="50" height="100" rx="4" fill="#d4a574" opacity="0.75"/>
      <text x="176" y="110">Wk 7</text>
      <rect x="240" y="55" width="50" height="135" rx="4" fill="url(#goldGrad)"/>
      <text x="244" y="75" fill="#0d3320" font-weight="700">Wk 10</text>
    </g>

    <text x="330" y="110" font-family="Georgia, serif" font-size="32" font-weight="800" fill="#f5ead9">
      68%
    </text>
    <text x="330" y="133" font-family="Arial, sans-serif" font-size="11" fill="#f5ead9" opacity="0.65">
      of patients now
    </text>
    <text x="330" y="148" font-family="Arial, sans-serif" font-size="11" fill="#f5ead9" opacity="0.65">
      book online
    </text>
  </g>

  <g transform="translate(140, 600)" opacity="0.8">
    <path d="M0 30 L14 8 L21 18 L28 4 L40 30 Z" fill="#d4a574"/>
    <text x="50" y="26" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f5ead9">
      Apexon
    </text>
  </g>
</svg>
