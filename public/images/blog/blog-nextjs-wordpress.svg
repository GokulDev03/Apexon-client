  </text>
  <text x="60" y="440" font-family="Georgia, serif" font-size="24" font-weight="600" fill="#f5ead9" opacity="0.85">
    Platform
  </text>

  <g transform="translate(60, 460)" opacity="0.7">
    <path d="M0 24 L11 6 L17 14 L23 3 L32 24 Z" fill="#d4a574"/>
    <text x="42" y="21" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f5ead9">Apexon</text>
