  </text>

  <!-- Icon: VS comparison -->
  <g transform="translate(60, 140)">
    <rect width="120" height="120" rx="24" fill="#f5ead9" opacity="0.08"/>
    <circle cx="40" cy="60" r="22" fill="none" stroke="url(#goldGrad2)" stroke-width="4"/>
    <circle cx="80" cy="60" r="22" fill="none" stroke="#f5ead9" stroke-width="4" opacity="0.5"/>
    <text x="60" y="66" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#f5ead9" text-anchor="middle">VS</text>
  </g>

  <text x="60" y="330" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5ead9">
