<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3320"/>
      <stop offset="100%" stop-color="#0a2818"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d4a8"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
    <pattern id="dots1" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  <rect width="800" height="500" fill="url(#dots1)"/>

  <!-- Faint mountain mark -->
  <g transform="translate(600,340)" opacity="0.12">
    <path d="M0 90 L45 15 L67 48 L90 8 L128 90 Z" fill="#d4a574"/>
  </g>

  <!-- Category chip -->
  <rect x="60" y="60" width="150" height="34" rx="17" fill="#d4a574" opacity="0.15"/>
  <text x="82" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#d4a574">
    PRICING &amp; PLANNING
  </text>

  <!-- Icon: price tag -->
  <g transform="translate(60, 140)">
    <rect width="120" height="120" rx="24" fill="#f5ead9" opacity="0.08"/>
    <g transform="translate(30,30)">
      <path d="M0 26 L26 0 L60 0 L60 34 L34 60 Z" fill="none" stroke="url(#goldGrad1)" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="14" cy="14" r="6" fill="url(#goldGrad1)"/>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="330" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#f5ead9">
    How Much Does a
  </text>
  <text x="60" y="372" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#f5ead9">
    Website Actually
  </text>
  <text x="60" y="414" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#f5ead9">
    Cost in <tspan fill="url(#goldGrad1)">2026?</tspan>
  </text>

  <!-- Footer mark -->
  <g transform="translate(60, 450)" opacity="0.7">
    <path d="M0 24 L11 6 L17 14 L23 3 L32 24 Z" fill="#d4a574"/>
    <text x="42" y="21" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f5ead9">Apexon</text>
  </g>
</svg>
